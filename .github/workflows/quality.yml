name: release-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source package
        run: python -m pip install --no-deps -e .
      - name: Validate release contracts
        run: python -B tools/validate_release.py
      - name: Validate canonical benchmark IDs
        run: python -B tools/normalize_benchmark_ids.py --benchmark-dir benchmark --check
      - name: Run offline unit tests
        run: python -B -m unittest discover -v
      - name: Parse Python and JSON files
        run: |
          python -B - <<'PY'
          import ast
          import json
          from pathlib import Path

          root = Path(".")
          for path in root.rglob("*.py"):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("AST/JSON checks passed")
          PY
